<!-- Header Section -->
<header>

</header>

<!-- Category Buttons (e.g. Uomini, Donne, Bambini) -->

  <button onclick="showImages('Uomini', 'Serigrafata')">Uomini Serigrafata</button>
  <button onclick="showImages('Uomini', 'Personalizzate')">Uomini Personalizzate</button>

  <!-- More filters as needed -->
</div>

<!-- Product Grid -->
<div id="product-grid" class="product-grid"></div>
